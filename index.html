<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#120403">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <title>Saber Duel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 타이틀 -->
  <section id="screen-title" class="screen">
    <h1 class="logo">SABER<span>DUEL</span></h1>
    <p class="tag">무스타파의 결투 · 원버튼 광선검 대결</p>
    <div class="menu">
      <button class="btn primary" data-mode="1p">1P vs CPU</button>
      <button class="btn" data-mode="2p">2P 대결 (한 기기)</button>
    </div>
    <p class="help">탭 = 상대에게 점프하며 베기 · 공중에서 한 번 더 탭 가능<br>광선검끼리 부딪히면 튕겨나고, 몸에 닿으면 한 방! 용암에 빠지면 패배. 5점 선취 승리.</p>
    <button id="btn-mute" class="icon-btn" aria-label="소리">🔊</button>
  </section>

  <!-- 캐릭터 & 스킨 선택 -->
  <section id="screen-select" class="screen hidden">
    <div class="sel-wrap">
      <div class="pick" data-side="0">
        <div class="pick-head">PLAYER 1</div>
        <canvas class="preview" width="240" height="260"></canvas>
        <div class="char-row">
          <button class="arrow prev" aria-label="이전 캐릭터">◀</button>
          <div class="char-name"></div>
          <button class="arrow next" aria-label="다음 캐릭터">▶</button>
        </div>
        <div class="skins"></div>
        <div class="skin-sub"></div>
      </div>

      <div class="mid">
        <div class="vs">VS</div>
        <div class="diff">
          <div class="diff-label">CPU 난이도</div>
          <div class="diff-btns">
            <button data-level="0">쉬움</button>
            <button data-level="1">보통</button>
            <button data-level="2">어려움</button>
          </div>
        </div>
        <button id="btn-fight" class="btn primary">결투 시작</button>
        <button id="btn-back" class="btn small">뒤로</button>
      </div>

      <div class="pick" data-side="1">
        <div class="pick-head">PLAYER 2</div>
        <canvas class="preview" width="240" height="260"></canvas>
        <div class="char-row">
          <button class="arrow prev" aria-label="이전 캐릭터">◀</button>
          <div class="char-name"></div>
          <button class="arrow next" aria-label="다음 캐릭터">▶</button>
        </div>
        <div class="skins"></div>
        <div class="skin-sub"></div>
      </div>
    </div>
  </section>

  <!-- 인게임 -->
  <div id="hud" class="hidden">
    <button id="btn-pause" class="icon-btn" aria-label="일시정지">❚❚</button>
  </div>

  <section id="screen-pause" class="screen overlay hidden">
    <h2>일시정지</h2>
    <button id="btn-resume" class="btn primary">계속하기</button>
    <button id="btn-quit" class="btn">메인 메뉴</button>
  </section>

  <section id="screen-result" class="screen overlay hidden">
    <h2 id="result-title"></h2>
    <p id="result-score"></p>
    <p id="result-quote"></p>
    <div class="menu row">
      <button id="btn-rematch" class="btn primary">다시 결투</button>
      <button id="btn-reselect" class="btn">캐릭터 선택</button>
      <button id="btn-menu" class="btn">메인 메뉴</button>
    </div>
  </section>

  <div id="rotate">📱↻ 가로 모드로 돌려주세요</div>

  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/fighter.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
